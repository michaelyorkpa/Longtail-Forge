name: Development pull request

on:
  pull_request:
    branches: [nightly]

permissions:
  contents: read

concurrency:
  group: development-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify_changes:
    name: Classify pull-request changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      github_only_docs: ${{ steps.changes.outputs.github_only_docs }}
      runtime_help_changed: ${{ steps.changes.outputs.runtime_help_changed }}
    steps:
      - name: Check out the proposed revision and complete pull-request history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Use the supported Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Classify the complete pull-request diff
        id: changes
        env:
          LTF_REGRESSION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/classify-github-changes.mjs --github-output

  development-gate:
    name: Development gate
    needs: classify_changes
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the proposed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Use the supported Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Context/setup timing
        run: node scripts/run-timed-stage.mjs "context/setup" -- npm ci
      - name: Closeout gate timing
        run: node scripts/run-timed-stage.mjs "closeout gates" -- npm run closeout
      - name: GitHub-only documentation validation scope
        if: needs.classify_changes.outputs.github_only_docs == 'true'
        run: |
          echo "GitHub-only documentation fast path - closeout/documentation consistency and changed-area regressions remain required; application typecheck, unit tests, and lint are not required."
      - name: Runtime Help validation scope
        if: needs.classify_changes.outputs.runtime_help_changed == 'true'
        run: |
          echo "Runtime Help changed - full application and browser validation remain required so the updated Help can deploy after merge."
      - name: Typecheck/unit/lint timing
        if: needs.classify_changes.outputs.github_only_docs != 'true'
        run: node scripts/run-timed-stage.mjs "typecheck/unit/lint" -- npm run check:fast
      - name: Run regressions selected from the pull-request diff
        env:
          LTF_REGRESSION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/run-timed-stage.mjs "regression buckets" -- npm run test:regressions:changed:ci

  browser-smoke:
    name: Browser smoke and accessibility
    needs: classify_changes
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: GitHub-only documentation browser fast path
        if: needs.classify_changes.outputs.github_only_docs == 'true'
        run: |
          echo "GitHub-only documentation fast path: Playwright browser installation and smoke/accessibility execution are not required."
      - if: needs.classify_changes.outputs.github_only_docs != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.classify_changes.outputs.github_only_docs != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: needs.classify_changes.outputs.github_only_docs != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Context/setup timing
        if: needs.classify_changes.outputs.github_only_docs != 'true'
        run: node scripts/run-timed-stage.mjs "context/setup" -- npm ci
      - if: needs.classify_changes.outputs.github_only_docs != 'true'
        run: npx playwright install --with-deps chromium
      - name: Browser check timing
        if: needs.classify_changes.outputs.github_only_docs != 'true'
        run: node scripts/run-timed-stage.mjs "browser checks" -- npm run test:e2e

  bounded-proxy-smoke:
    name: Complete maintenance release rehearsal
    needs: classify_changes
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: GitHub-only documentation proxy fast path
        if: needs.classify_changes.outputs.github_only_docs == 'true'
        run: |
          echo "GitHub-only documentation fast path: disposable Nginx/Caddy installation and execution are not required."
      - name: Check out the proposed revision
        if: needs.classify_changes.outputs.github_only_docs != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use the supported Node runtime
        if: needs.classify_changes.outputs.github_only_docs != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install application and Nginx dependencies
        if: needs.classify_changes.outputs.github_only_docs != 'true'
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nginx openssl
      - name: Restore the checksum-bound Caddy download cache
        if: needs.classify_changes.outputs.github_only_docs != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/longtail-forge/caddy
          key: caddy-${{ runner.os }}-${{ runner.arch }}-2.11.4-8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9
      - name: Install pinned Caddy smoke binary
        if: needs.classify_changes.outputs.github_only_docs != 'true'
        env:
          CADDY_ARCHIVE_SHA512: 8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9
          CADDY_VERSION: 2.11.4
        run: |
          mkdir -p "$RUNNER_TEMP/caddy"
          mkdir -p "$HOME/.cache/longtail-forge/caddy"
          CADDY_ARCHIVE="$HOME/.cache/longtail-forge/caddy/caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          if [ ! -f "$CADDY_ARCHIVE" ]; then
            curl --fail --location --proto '=https' --tlsv1.2 --output "$CADDY_ARCHIVE" "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          fi
          echo "${CADDY_ARCHIVE_SHA512}  $CADDY_ARCHIVE" | sha512sum --check --strict
          tar --extract --gzip --file "$CADDY_ARCHIVE" --directory "$RUNNER_TEMP/caddy" caddy
          chmod 0755 "$RUNNER_TEMP/caddy/caddy"
          echo "$RUNNER_TEMP/caddy" >> "$GITHUB_PATH"
      - name: Execute the complete maintenance release rehearsal
        if: needs.classify_changes.outputs.github_only_docs != 'true'
        run: npm run maintenance:rehearse

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
