name: Nightly promotion

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: promotion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  promotion-source:
    name: Promotion source
    runs-on: ubuntu-24.04
    steps:
      - name: Require nightly promotion or an explicit hotfix branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          PROMOTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test -n "$PROMOTED_SHA"
          case "$HEAD_REF" in
            nightly) echo "Promoting exact nightly revision $PROMOTED_SHA" ;;
            hotfix/*) echo "Validating focused main hotfix $HEAD_REF at $PROMOTED_SHA" ;;
            *) echo "main accepts only nightly promotion or hotfix/* pull requests" >&2; exit 1 ;;
          esac

  release-gate:
    name: Release gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node scripts/run-timed-stage.mjs "context/setup" -- npm ci
      - run: node scripts/run-timed-stage.mjs "closeout gates" -- npm run closeout
      - run: node scripts/run-timed-stage.mjs "typecheck/unit/lint" -- npm run check:fast
      - run: node scripts/run-timed-stage.mjs "regression buckets" -- npm run test:regressions
      - run: node scripts/run-timed-stage.mjs "permission checks" -- npm run test:permissions
      - run: npm audit --audit-level=high

  browser-gate:
    name: Browser gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node scripts/run-timed-stage.mjs "context/setup" -- npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/run-timed-stage.mjs "browser checks" -- npm run test:e2e

  packaging-recovery:
    name: Packaging and recovery
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node scripts/run-timed-stage.mjs "context/setup" -- npm ci
      - run: node scripts/run-timed-stage.mjs "packaging artifact smoke" -- npm run artifact:smoke
      - run: node scripts/run-timed-stage.mjs "packaging backup drill" -- npm run backup:drill
      - run: node scripts/run-timed-stage.mjs "packaging bare-metal smoke" -- npm run bare-metal:smoke
      - run: node scripts/run-timed-stage.mjs "packaging container smoke" -- npm run container:smoke

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
