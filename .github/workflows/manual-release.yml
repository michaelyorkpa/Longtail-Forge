name: Manual GitHub release

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact 40-character commit SHA reachable from main
        required: true
        type: string
      tag:
        description: Exact version tag, for example v1.2.3
        required: true
        type: string
      confirmation:
        description: Enter RELEASE plus the tag and full SHA
        required: true
        type: string
      draft:
        description: Create a draft release for final operator review
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: manual-github-release
  cancel-in-progress: false

jobs:
  publish-immutable-release:
    name: Publish immutable tag and release assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate the selected main revision and release confirmation
        env:
          REVISION: ${{ inputs.revision }}
          TAG: ${{ inputs.tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          node scripts/release/validate-release-revision.mjs --operation deploy --revision "$REVISION" --confirmation "$CONFIRMATION" --required-confirmation "RELEASE $TAG $REVISION"
          test "$TAG" = "v$(git show "$REVISION:package.json" | node -e "let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")"
      - name: Check out and revalidate the immutable revision
        env:
          REVISION: ${{ inputs.revision }}
        run: git checkout --detach "$REVISION"
      - run: npm ci
      - run: npm run closeout
      - run: npm run check
      - name: Build checksummed release assets
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          npm run artifact:build
          node scripts/release/create-release-metadata.mjs --artifact "dist/longtail-forge-$(node -p "require('./package.json').version").tgz" --commit "$REVISION" --channel main --output dist/release-metadata.json
      - name: Create immutable tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ inputs.revision }}
          TAG: ${{ inputs.tag }}
          DRAFT: ${{ inputs.draft }}
        run: |
          if git rev-parse "$TAG^{commit}" >/dev/null 2>&1; then
            test "$(git rev-parse "$TAG^{commit}")" = "$REVISION"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$REVISION" -m "Longtail Forge $TAG"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace immutable assets." >&2
            exit 1
          fi
          DRAFT_FLAG=""
          if test "$DRAFT" = "true"; then DRAFT_FLAG="--draft"; fi
          gh release create "$TAG" dist/*.tgz dist/*.tgz.sha256 dist/release-metadata.json --verify-tag --title "Longtail Forge $TAG" --generate-notes $DRAFT_FLAG
