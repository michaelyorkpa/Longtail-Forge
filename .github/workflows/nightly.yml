name: Nightly integration

on:
  push:
    branches: [nightly]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-integration
  cancel-in-progress: false

jobs:
  classify_changes:
    name: Classify nightly changes
    runs-on: ubuntu-24.04
    outputs:
      github_only_docs: ${{ steps.changes.outputs.github_only_docs }}
      runtime_help_changed: ${{ steps.changes.outputs.runtime_help_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'nightly' }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Classify the pushed range or select the full scheduled/manual path
        id: changes
        env:
          LTF_CHANGE_BASE_SHA: ${{ github.event.before }}
          LTF_CHANGE_COMPARISON: range
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            node scripts/classify-github-changes.mjs --github-output
          else
            echo "github_only_docs=false" >> "$GITHUB_OUTPUT"
            echo "runtime_help_changed=false" >> "$GITHUB_OUTPUT"
          fi

  integration-gate:
    name: Nightly full gate
    needs: classify_changes
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
      artifact: ${{ steps.artifact.outputs.path }}
    steps:
      - name: GitHub-only documentation integration fast path
        if: needs.classify_changes.outputs.github_only_docs == 'true'
        run: |
          echo "GitHub-only documentation changed; no runtime artifact, browser gate, or deployment is required."
      - if: needs.classify_changes.outputs.github_only_docs != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'nightly' }}
          fetch-depth: 0
      - if: needs.classify_changes.outputs.github_only_docs != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Runtime Help deployment route
        if: needs.classify_changes.outputs.runtime_help_changed == 'true'
        run: |
          echo "Runtime Help changed; full validation, artifact creation, browser proof, and demo deployment remain required."
      - if: needs.classify_changes.outputs.github_only_docs != 'true'
        run: node scripts/run-timed-stage.mjs "context/setup" -- npm ci
      - if: needs.classify_changes.outputs.github_only_docs != 'true'
        run: node scripts/run-timed-stage.mjs "closeout gates" -- npm run closeout
      - if: needs.classify_changes.outputs.github_only_docs != 'true'
        run: node scripts/run-timed-stage.mjs "typecheck/unit/lint" -- npm run check:fast
      - if: needs.classify_changes.outputs.github_only_docs != 'true'
        run: node scripts/run-timed-stage.mjs "regression buckets" -- npm run test:regressions
      - if: needs.classify_changes.outputs.github_only_docs != 'true'
        run: node scripts/run-timed-stage.mjs "permission checks" -- npm run test:permissions
      - if: needs.classify_changes.outputs.github_only_docs != 'true'
        run: node scripts/run-timed-stage.mjs "packaging" -- npm run artifact:build -- --source-branch nightly
      - id: revision
        name: Record the exact nightly revision
        run: echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - id: artifact
        name: Locate and describe the immutable artifact
        if: needs.classify_changes.outputs.github_only_docs != 'true'
        run: |
          echo "path=dist/longtail-forge-$(node -p "require('./package.json').version").tgz" >> "$GITHUB_OUTPUT"
          node scripts/release/create-release-metadata.mjs --artifact "dist/longtail-forge-$(node -p "require('./package.json').version").tgz" --commit "$(git rev-parse HEAD)" --channel nightly --source-branch nightly --output dist/release-metadata.json
      - if: needs.classify_changes.outputs.github_only_docs != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-${{ steps.revision.outputs.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ steps.artifact.outputs.path }}
            ${{ steps.artifact.outputs.path }}.sha256
            dist/release-metadata.json

  browser-gate:
    name: Nightly browser gate
    needs: classify_changes
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: GitHub-only documentation browser fast path
        if: needs.classify_changes.outputs.github_only_docs == 'true'
        run: |
          echo "GitHub-only documentation changed; no Playwright installation or browser execution is required."
      - if: needs.classify_changes.outputs.github_only_docs != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'nightly' }}
      - if: needs.classify_changes.outputs.github_only_docs != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: needs.classify_changes.outputs.github_only_docs != 'true'
        run: node scripts/run-timed-stage.mjs "context/setup" -- npm ci
      - if: needs.classify_changes.outputs.github_only_docs != 'true'
        run: npx playwright install --with-deps chromium
      - if: needs.classify_changes.outputs.github_only_docs != 'true'
        run: node scripts/run-timed-stage.mjs "browser checks" -- npm run test:e2e

  github-docs-no-deploy:
    name: GitHub-only docs - no deployment
    if: >-
      ${{
        always()
        && github.event_name == 'push'
        && needs.classify_changes.result == 'success'
        && needs.classify_changes.outputs.github_only_docs == 'true'
        && needs.integration-gate.result == 'success'
        && needs.browser-gate.result == 'success'
      }}
    needs: [classify_changes, integration-gate, browser-gate]
    runs-on: ubuntu-24.04
    steps:
      - run: echo "GitHub-only documentation is complete; no environment deployment was created."

  deploy-demo:
    name: Deploy demo development
    if: >-
      ${{
        always()
        && github.event_name == 'push'
        && needs.classify_changes.result == 'success'
        && needs.classify_changes.outputs.github_only_docs != 'true'
        && needs.integration-gate.result == 'success'
        && needs.browser-gate.result == 'success'
      }}
    needs: [classify_changes, integration-gate, browser-gate]
    runs-on: ubuntu-24.04
    environment: demo-development
    steps:
      - name: Check whether persistent demo deployment is configured
        id: enabled
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
        run: echo "value=$DEPLOY_ENABLED" >> "$GITHUB_OUTPUT"
      - if: steps.enabled.outputs.value == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.enabled.outputs.value == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-${{ needs.integration-gate.outputs.revision }}
          path: dist
      - name: Deploy and verify the exact nightly artifact
        if: steps.enabled.outputs.value == 'true'
        env:
          LTF_DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          LTF_DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          LTF_DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          LTF_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          LTF_DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          LTF_DEPLOY_INBOX: ${{ vars.DEPLOY_INBOX }}
          LTF_DEPLOY_HELPER: ${{ vars.DEPLOY_HELPER }}
          LTF_DEPLOY_PUBLIC_URL: ${{ vars.DEPLOY_URL }}
        run: node scripts/release/deploy-via-ssh.mjs --mode deploy --artifact "dist/$(node -p "require('./package.json').name + '-' + require('./package.json').version + '.tgz'")" --metadata dist/release-metadata.json
      - name: Report an intentionally disabled transport
        if: steps.enabled.outputs.value != 'true'
        run: echo "Demo deployment is disabled until its isolated host, credentials, and URL are configured."
