# Install one reviewed server pair per Longtail Forge hostname on the public
# Nginx edge. Replace the example hostname, certificate paths, and WireGuard
# address. The WireGuard firewall must allow this edge to reach Caddy and must
# not expose the Caddy listener to the Internet or unrelated tunnel peers.

# This file is loaded in Nginx's `http` context. Keep the public-connection IP
# as the key: this edge replaces forwarded client identity below and must not
# rate-limit on an untrusted request header. The application independently
# enforces pre-verification admission and durable credential-failure throttles.
limit_req_zone $binary_remote_addr zone=longtail_forge_login:10m rate=10r/m;

upstream longtail_forge_private_preview {
    server 10.57.67.2:8080;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name forge.example.com;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name forge.example.com;

    ssl_certificate /etc/letsencrypt/live/forge.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forge.example.com/privkey.pem;

    # The application currently allows up to 50 streamed files at 5 MiB each.
    # Keep a bounded allowance for multipart framing; review this value if the
    # application-side batch or per-file limits change.
    client_max_body_size 260m;

    # Defense in depth only. Permit a small immediate burst, then bound login
    # requests per public client IP before they cross WireGuard. Application
    # admission remains authoritative and returns the same generic envelope.
    error_page 429 = @longtail_forge_login_limited;
    location = /api/login {
        limit_req zone=longtail_forge_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://longtail_forge_private_preview;
        proxy_http_version 1.1;
        proxy_request_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location @longtail_forge_login_limited {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
        return 429 '{"error":"Too many attempts. Try again later."}';
    }

    location / {
        proxy_pass http://longtail_forge_private_preview;
        proxy_http_version 1.1;
        proxy_request_buffering off;

        # This public edge is the only component allowed to derive these
        # values from the accepted client connection. Replace, never append,
        # every client-supplied forwarding value before crossing WireGuard.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# Keep an explicit default server outside the application server blocks so an
# unknown Host/SNI value is never forwarded to a Longtail Forge installation.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Reject unknown SNI during the TLS handshake without presenting an
    # application certificate or forwarding the request.
    ssl_reject_handshake on;
}
