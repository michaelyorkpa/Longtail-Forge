# Install one reviewed server pair per Longtail Forge hostname on the public
# Nginx edge. Replace the example hostname, certificate paths, and WireGuard
# address. The WireGuard firewall must allow this edge to reach Caddy and must
# not expose the Caddy listener to the Internet or unrelated tunnel peers.

# This file is loaded in Nginx's `http` context. Keep the public-connection IP
# as the key: this edge replaces forwarded client identity below and must not
# rate-limit on an untrusted request header. The application independently
# enforces pre-verification admission and durable credential-failure throttles.
# Install the reviewed fallback page root-owned as
# /usr/local/share/longtail-forge-edge/edge-unavailable.html (0644 in a
# root-owned 0755 directory). The exact internal URI below cannot be requested
# by a public client and does not expose the directory as a file server.
limit_req_zone $binary_remote_addr zone=longtail_forge_login:10m rate=10r/m;

upstream longtail_forge_private_preview {
    server 10.57.67.2:8080;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name forge.example.com;
    if ($host != forge.example.com) { return 444; }
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name forge.example.com;
    if ($host != forge.example.com) { return 444; }

    ssl_certificate /etc/letsencrypt/live/forge.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forge.example.com/privkey.pem;

    # The application currently allows up to 50 streamed files at 5 MiB each.
    # Keep a bounded allowance for multipart framing; review this value if the
    # application-side batch or per-file limits change.
    client_max_body_size 260m;

    # Keep upstream responses authoritative. With interception disabled, an
    # application- or Caddy-produced 502/503/504 passes through unchanged.
    # The error_page routes run only when this Nginx edge owns the proxy
    # transport failure (for example private Caddy, tunnel, or app host down).
    proxy_intercept_errors off;
    error_page 502 503 504 =503 /__longtail_forge_edge_unavailable;

    location = /__longtail_forge_edge_unavailable {
        internal;
        root /usr/local/share/longtail-forge-edge;
        try_files /edge-unavailable.html =503;

        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; style-src 'unsafe-inline'" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Retry-After "60" always;
        add_header Strict-Transport-Security "max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Monitoring must never receive branded HTML or stale app identity. These
    # exact paths retain valid upstream JSON, but an edge-owned transport
    # failure becomes a minimal generic JSON 503.
    location ~ ^/(?:healthz|readyz|api/app-info)$ {
        error_page 502 503 504 =503 @longtail_forge_edge_diagnostic_unavailable;

        proxy_pass http://longtail_forge_private_preview;
        proxy_http_version 1.1;
        proxy_request_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location @longtail_forge_edge_diagnostic_unavailable {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
        add_header Strict-Transport-Security "max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 503 '{"status":"unavailable"}';
    }

    # Defense in depth only. Permit a small immediate burst, then bound login
    # requests per public client IP before they cross WireGuard. Application
    # admission remains authoritative and returns the same generic envelope.
    error_page 429 = @longtail_forge_login_limited;
    location = /api/login {
        limit_req zone=longtail_forge_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://longtail_forge_private_preview;
        proxy_http_version 1.1;
        proxy_request_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location @longtail_forge_login_limited {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
        add_header Strict-Transport-Security "max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 429 '{"error":"Too many attempts. Try again later."}';
    }

    location / {
        proxy_pass http://longtail_forge_private_preview;
        proxy_http_version 1.1;
        proxy_request_buffering off;

        # This public edge is the only component allowed to derive these
        # values from the accepted client connection. Replace, never append,
        # every client-supplied forwarding value before crossing WireGuard.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# Keep an explicit default server outside the application server blocks so an
# unknown Host/SNI value is never forwarded to a Longtail Forge installation.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Reject unknown SNI during the TLS handshake without presenting an
    # application certificate or forwarding the request.
    ssl_reject_handshake on;
}
