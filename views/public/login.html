<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Longtail Forge</title>
    <script src="js/theme-init.js"></script>
    <link rel="stylesheet" href="css/longtail-forge.css">
  </head>
  <body>
    <main class="login-page">
      <form class="login-form" data-login-form>
        <h1>Longtail Forge</h1>

        <label>
          Email Address
          <input
            type="email"
            name="username"
            autocomplete="username"
            required
            autofocus
          >
        </label>

        <label>
          Password
          <input
            type="password"
            name="password"
            autocomplete="current-password"
            required
          >
        </label>

        <button type="submit">Log In</button>
        <p data-login-status role="status" aria-live="polite"></p>
      </form>

      <form class="login-form" data-required-password-form hidden>
        <h1>Change Your Password</h1>
        <p>Your administrator issued a temporary password. Choose a new password before continuing.</p>

        <label>
          Temporary Password
          <input type="password" name="currentPassword" autocomplete="current-password" data-required-current-password required>
        </label>

        <label>
          New Password
          <input type="password" name="newPassword" autocomplete="new-password" minlength="8" data-required-new-password required>
        </label>

        <label>
          Confirm New Password
          <input type="password" name="confirmPassword" autocomplete="new-password" minlength="8" data-required-confirm-password required>
        </label>

        <button type="submit">Change Password</button>
        <p data-required-password-status role="status" aria-live="polite"></p>
      </form>
    </main>

    <script src="js/login.js"></script>
    <script src="js/footer.js"></script>
  </body>
</html>
